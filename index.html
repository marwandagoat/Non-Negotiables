<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Non-Negotiables</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Non-Negotiables">
<meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14131b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600&display=swap">
<style>
/* Layout: one soft column — serif italic masthead, calendar card with section-colored dots, then the day's tasks grouped Business / School / Mind / Body */
:root{
  --bg:#eef0f4; --bg2:#e4e2f0; --surface:rgba(255,255,255,.72); --solid:#ffffff; --fg:#22212b; --muted:#6f6c7c; --line:rgba(34,33,43,.09);
  --done:#3f9e6e; --biz:#c98a2e; --school:#4a86c5; --mind:#8a6bc9; --body:#d0675a;
  --display:"Instrument Serif",Georgia,serif; --ui:"Outfit",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14131b;--bg2:#1d1a2a;--surface:rgba(34,32,46,.72);--solid:#211f2c;--fg:#ecebf3;--muted:#9d99ae;--line:rgba(236,235,243,.09);--done:#5cc28d;--biz:#e2a95a;--school:#76a9e0;--mind:#ad93e6;--body:#ea8a7d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14131b;--bg2:#1d1a2a;--surface:rgba(34,32,46,.72);--solid:#211f2c;--fg:#ecebf3;--muted:#9d99ae;--line:rgba(236,235,243,.09);--done:#5cc28d;--biz:#e2a95a;--school:#76a9e0;--mind:#ad93e6;--body:#ea8a7d;color-scheme:dark}
html{background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
body{margin:0;-webkit-user-select:none;user-select:none}
body{background:var(--bg);background-image:radial-gradient(ellipse 80% 50% at 15% 0%,var(--bg2),transparent 70%),radial-gradient(ellipse 60% 40% at 100% 30%,color-mix(in srgb,var(--mind) 10%,transparent),transparent 70%);background-attachment:fixed;color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.45;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding-block:36px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-style:italic;font-weight:400;font-size:52px;line-height:1;margin:6px 0 0;letter-spacing:-.01em}
.card{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px -18px rgba(30,25,60,.35)}
.cal{padding:18px;display:flex;flex-direction:column;gap:14px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mname{font-family:var(--display);font-size:30px;line-height:1}
.mstat{color:var(--muted);font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
.nav{display:flex;gap:6px}
.nav button{font:inherit;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--solid);color:var(--fg);cursor:pointer;font-size:18px;line-height:1}
.nav button:disabled{opacity:.3;cursor:default}
.nav button:focus-visible{outline:2px solid var(--mind);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wd{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
.day{font:inherit;aspect-ratio:1/1;max-width:100%;border:1px solid transparent;border-radius:14px;background:var(--solid);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:2px;transition:background .2s,transform .15s}
.day:active{transform:scale(.94)}
.day .n{font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:3px}
.dots{display:flex;gap:1.5px;max-width:100%}
.dots i{width:3px;height:3px;border-radius:50%;background:var(--line)}
.dots i.b{background:var(--biz)} .dots i.s{background:var(--school)} .dots i.m{background:var(--mind)}
.day.full{background:var(--done);color:#fff;box-shadow:0 6px 14px -8px var(--done)}
.day.full .dots{display:none}
.day.full::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-4px}
.gym{width:6px;height:6px;border-radius:50%;background:var(--body)}
.day.full .gym{background:#fff}
.day.today{border-color:var(--fg)}
.day.sel{outline:2px solid var(--mind);outline-offset:1px}
.day.off{background:none;color:var(--muted);opacity:.4;cursor:default}
.day.off .dots{visibility:hidden}
.day:focus-visible{outline:2px solid var(--mind);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:7px;height:7px;border-radius:50%}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 4px}
.dtitle{font-family:var(--display);font-size:30px;line-height:1.05}
.dcount{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sections{display:grid;gap:12px}
.sec{padding:6px 0}
.sh{display:flex;align-items:center;gap:10px;padding:12px 18px 6px}
.sh .no{font-family:var(--display);font-style:italic;font-size:22px;line-height:1;color:var(--c)}
.sh .nm{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
.sh .ct{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.checks{list-style:none;margin:0;padding:0}
label{display:flex;gap:14px;align-items:flex-start;padding:11px 18px;cursor:pointer}
input[type=checkbox]{appearance:none;flex:none;width:22px;height:22px;margin:1px 0 0;border:1.5px solid var(--c);border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:background .15s}
input[type=checkbox]:checked{background:var(--c)}
input[type=checkbox]:checked::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
input:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.t{font-weight:500}
.s{color:var(--muted);font-size:13px}
li.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--c)}
.opt{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.left{display:flex;align-items:center;gap:16px;padding:16px 20px}
.lnum{font-family:var(--display);font-size:64px;line-height:.9;font-variant-numeric:tabular-nums;color:var(--done)}
.ltxt{display:flex;flex-direction:column;gap:2px;min-width:0}
.llbl{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.lsub{font-size:13px;color:var(--muted)}
.lsub:empty{display:none}
.time{font-size:11px;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px;margin-left:8px;vertical-align:2px;font-weight:500;white-space:nowrap}
.hint{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Oct 26 — Dec 31</div>
    <h1>Non-Negotiables</h1>
  </header>
  <section class="card left" aria-label="Days left in the year"><span class="lnum" id="left"></span><span class="ltxt"><span class="llbl" id="leftLbl"></span><span class="lsub" id="leftSub"></span></span></section>

  <section class="card cal" aria-label="Monthly calendar">
    <div class="mhead">
      <div><div class="mname" id="mname"></div><div class="mstat" id="mstat"></div></div>
      <div class="nav"><button id="prev" type="button" aria-label="Previous month">‹</button><button id="next" type="button" aria-label="Next month">›</button></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i style="background:var(--biz)"></i>Business</span>
      <span><i style="background:var(--school)"></i>School</span>
      <span><i style="background:var(--mind)"></i>Mind</span>
      <span><i style="background:var(--body)"></i>Body</span>
      <span><i style="background:var(--done)"></i>Day done</span>
    </div>
  </section>
  <div class="hint">Tap a day to mark it done · tap again to undo</div>

  <div class="dayhead"><span class="dtitle" id="dtitle"></span><span class="dcount" id="dcount"></span></div>
  <div class="sections" id="sections"></div>
</div>

<script>
const SECTIONS=[
  {name:'Business',c:'var(--biz)',items:['post','icp','copy','fb']},
  {name:'School',c:'var(--school)',items:['op']},
  {name:'Mind',c:'var(--mind)',items:['med','pray']},
  {name:'Body',c:'var(--body)',items:['gym']}
];
const TASKS={post:'1–2 high quality posts',icp:'Research ICP and product',copy:'Learn something new about copywriting',fb:'Feedback (1% better)',op:'O&amp;P research',shop:'Shop homework',med:'Meditation',pray:'Prayer 5x',gym:'Go to the gym (3–4x a week)'};
const TIME={icp:'30 min',op:'45 min',med:'15 min'};
const GYM='gym', DAILY=['post','icp','copy','fb','op','med','pray'], ND=DAILY.length;
const DOTCLS={post:'b',icp:'b',copy:'b',fb:'b',op:'s',shop:'s',med:'m',pray:'m'};
const KEY='non-negotiables-v2';
let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const startKey='2026-10-26', endKey='2026-12-31';
const inRange=k=>k>=startKey&&k<=endKey;
let todayKey=iso(new Date());
const MONTHS=[9,10,11];
let mIdx=new Date().getFullYear()===2026?Math.max(0,MONTHS.indexOf(new Date().getMonth())):0;
let selKey=inRange(todayKey)?todayKey:startKey;
const get=(k,i)=>!!(state[k]&&state[k][i]);
const set=(k,i,v)=>{state[k]=state[k]||{};state[k][i]=v;};
const count=k=>DAILY.filter(i=>get(k,i)).length;
const weekGym=k=>{const [y,m,d]=k.split('-').map(Number);const base=new Date(y,m-1,d);const s=new Date(y,m-1,d-base.getDay());let n=0;for(let i=0;i<7;i++){const x=new Date(s);x.setDate(s.getDate()+i);if(get(iso(x),GYM))n++;}return n;};
function renderLeft(){
  const now=new Date(), t=new Date(now.getFullYear(),now.getMonth(),now.getDate()), e=new Date(now.getFullYear(),11,31);
  const left=Math.round((e-t)/864e5)+1;
  document.getElementById('left').textContent=left;
  document.getElementById('leftLbl').textContent=(left===1?'day':'days')+' left in '+now.getFullYear()+', counting today';
  document.getElementById('leftSub').textContent=todayKey<startKey?'Starts Monday, Oct 26':'';
}

function renderCal(){
  const m=MONTHS[mIdx], y=2026;
  const first=new Date(y,m,1), dim=new Date(y,m+1,0).getDate();
  document.getElementById('mname').textContent=first.toLocaleDateString('en-US',{month:'long'});
  let full=0,active=0,gyms=0;
  let html=['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>'<div class="wd">'+d+'</div>').join('');
  for(let i=0;i<first.getDay();i++)html+='<div></div>';
  for(let d=1;d<=dim;d++){
    const k=y+'-'+pad(m+1)+'-'+pad(d), on=inRange(k), n=on?count(k):0, g=on&&get(k,GYM);
    if(on){active++;if(n===ND)full++;if(g)gyms++;}
    const cls=['day',on?'':'off',on&&n===ND?'full':'',k===todayKey?'today':'',k===selKey?'sel':''].join(' ');
    const dots=DAILY.map(i=>'<i class="'+(on&&get(k,i)?DOTCLS[i]:'')+'"></i>').join('');
    html+='<button type="button" class="'+cls+'" data-k="'+k+'" '+(on?'':'disabled')+' aria-pressed="'+(n===ND)+'" aria-label="'+k+(n===ND?', done':', '+n+' of '+ND+' done')+(g?', gym':'')+'"><span class="n">'+d+(g?'<b class="gym" aria-hidden="true"></b>':'')+'</span><span class="dots">'+dots+'</span></button>';
  }
  const g=document.getElementById('grid');g.innerHTML=html;
  g.querySelectorAll('.day:not(.off)').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.k, done=count(k)===ND;
    DAILY.forEach(i=>set(k,i,!done));
    selKey=k;save();renderCal();renderDay();
  }));
  document.getElementById('mstat').textContent=full+' of '+active+' days done · '+gyms+' gym days';
  document.getElementById('prev').disabled=mIdx===0;
  document.getElementById('next').disabled=mIdx===MONTHS.length-1;
}
function renderDay(){
  const [y,mo,d]=selKey.split('-').map(Number);
  const dt=new Date(y,mo-1,d);
  document.getElementById('dtitle').textContent=(selKey===todayKey?'Today, ':'')+dt.toLocaleDateString('en-US',{weekday:selKey===todayKey?undefined:'long',month:'long',day:'numeric'});
  const n=count(selKey);
  document.getElementById('dcount').textContent=n===ND?'All done':n+' of '+ND+' done';
  const wrap=document.getElementById('sections');wrap.innerHTML='';
  SECTIONS.forEach((sec,si)=>{
    const el=document.createElement('section');el.className='card sec';el.style.setProperty('--c',sec.c);
    const isBody=sec.name==='Body';
    const ct=isBody?weekGym(selKey)+' this week':sec.items.filter(i=>get(selKey,i)).length+'/'+sec.items.length;
    el.innerHTML='<div class="sh"><span class="nm">'+sec.name+'</span><span class="ct">'+ct+'</span></div><ul class="checks"></ul>';
    const ul=el.querySelector('ul');
    sec.items.forEach(i=>{
      const li=document.createElement('li');const on=get(selKey,i);li.className=on?'done':'';
      li.innerHTML='<label><input type="checkbox" id="c'+i+'"'+(on?' checked':'')+'><span class="txt"><span class="t">'+TASKS[i]+(TIME[i]?'<span class="time">'+TIME[i]+'</span>':'')+(i===GYM?'<span class="opt">Optional</span>':'')+'</span>'+(i===GYM?'<span class="s">Doesn’t count toward the day</span>':'')+'</span></label>';
      li.querySelector('input').addEventListener('change',e=>{set(selKey,i,e.target.checked);save();renderCal();renderDay();});
      ul.appendChild(li);
    });
    wrap.appendChild(el);
  });
}
document.getElementById('prev').addEventListener('click',()=>{if(mIdx>0){mIdx--;renderCal();}});
document.getElementById('next').addEventListener('click',()=>{if(mIdx<MONTHS.length-1){mIdx++;renderCal();}});
renderLeft();renderCal();renderDay();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const t=iso(new Date());if(t!==todayKey){todayKey=t;if(inRange(t))selKey=t;renderLeft();renderCal();renderDay();}}});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
